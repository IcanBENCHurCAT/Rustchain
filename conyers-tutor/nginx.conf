# ═══════════════════════════════════════════════════════════════════════════
# Nginx configuration for Conyers Tutor Frontend (PWA)
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.cloudflare.com;" always;

    # ── Health check endpoint ─────────────────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"tutor-frontend"}';
    }

    # ── Service Worker — do NOT cache ─────────────────────────────────
    location ~* ^/(registerSW|sw|workbox[-_]) {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── PWA manifest — long-lived cache ───────────────────────────────
    location ~* ^/(manifest|icon-) {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json";
    }

    # ── Static assets (hashed) — long-lived cache ─────────────────────
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Images, fonts, SVGs ───────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── HTML — cache with validation ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        expires -1;

        # SPA fallback — all non-file routes go to index.html
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.html break;
        }
    }

    # ── Gzip compression ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
